[project]
name = "doculens"
version = "0.1.0"
description = "Evidence-grounded knowledge copilot with reproducible retrieval experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.39,<2.1", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1", "python-multipart>=0.0.20,<1", "jinja2>=3.1.6,<4",
  "pypdf>=5.4,<7", "numpy>=2.2,<3", "rank-bm25==0.2.2", "httpx>=0.28,<1",
  "sentence-transformers>=5.1,<6", "torch>=2.14,<2.15", "tiktoken>=0.9,<1", "psutil>=7,<8",
]
[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "mypy>=1.15,<2", "reportlab>=4.3,<5", "playwright>=1.51,<2"]
[project.scripts]
doculens = "doculens.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/doculens"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: downloaded model integration", "provider: configured local or remote provider integration", "postgres: PostgreSQL integration"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
files = ["src/doculens"]
check_untyped_defs = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
